name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch: # "Run workflow" button: deploys the selected branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Check deploy bundle
        run: python deploy/deploy_space.py --dry-run

  docker:
    name: Docker build + smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ai-learning-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container and check health
        run: |
          docker run -d --name app -p 7860:7860 -e APP_PASSWORD=ci-secret ai-learning-assistant:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:7860/api/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          grep -q '"auth_required":true' health.json
          grep -q '"knowledge_backend":"in-memory"' health.json
          curl -fsS -o /dev/null http://localhost:7860/
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:7860/api/chat \
                  -H 'Content-Type: application/json' -d '{"message":"hi"}')" = "401"
          echo "Smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs app || true

  deploy:
    name: Deploy to Hugging Face Spaces
    needs: docker
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install "huggingface_hub>=0.24"

      - name: Deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          SPACE_PRIVATE: ${{ vars.SPACE_PRIVATE }}
          ALLOW_PUBLIC: ${{ vars.ALLOW_PUBLIC }}
          GIT_SHA: ${{ github.sha }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          PGVECTOR_CONN: ${{ secrets.PGVECTOR_CONN }}
          AI_MODEL_PATH: ${{ vars.AI_MODEL_PATH }}
          AI_MODEL_API: ${{ vars.AI_MODEL_API }}
          RATE_LIMIT_PER_MINUTE: ${{ vars.RATE_LIMIT_PER_MINUTE }}
        run: python deploy/deploy_space.py
